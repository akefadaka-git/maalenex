name: A5.3.4 Edge Security Verification

on:
  push:
    branches:
      - a5/a5-3-4-edge-security-hardening

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend, PostgreSQL, migrations and edge-security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      RUN_POSTGRES_INTEGRATION: "1"
      IDENTITY_EMAIL_DELIVERY_ENABLED: "false"
      IDENTITY_EXPOSE_TEST_TOKENS: "false"
    steps:
      - name: Checkout exact A5.3.4 commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and verification dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app migrations tests scripts
      - name: Ruff correctness checks
        run: python -m ruff check --select E4,E7,E9,F --ignore F401 app migrations tests scripts
      - name: Apply all migrations
        run: python -m alembic upgrade head
      - name: Verify service registry seed idempotency
        run: python -m scripts.seed_platform_services && python -m scripts.seed_platform_services
      - name: Run full backend and PostgreSQL integration suite
        run: python -m pytest -q
      - name: Verify Alembic model metadata parity
        run: python -m alembic check
      - name: Verify full downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend:
    name: Frontend tests, typecheck, build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact A5.3.4 commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from committed lockfile
        run: npm ci --no-fund
      - name: Run frontend tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

  backend-security:
    name: Python dependency and static security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact A5.3.4 commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Generate audit requirements from project metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = project.get("dependencies", []) + project.get("optional-dependencies", {}).get("dev", [])
          Path("/tmp/maalenex-a5-3-4-requirements.txt").write_text("\n".join(requirements) + "\n", encoding="utf-8")
          PY
      - name: Audit Python dependencies
        run: pip-audit -r /tmp/maalenex-a5-3-4-requirements.txt
      - name: Bandit high-severity static security scan
        run: bandit -r app -ll
