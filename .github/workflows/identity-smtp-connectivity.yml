name: MaaleNex SMTP connectivity (manual, non-sending)

on:
  workflow_dispatch:
    inputs:
      confirm_check:
        description: Confirm a non-sending SMTP connection/TLS/authentication check
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smtp-connectivity:
    if: ${{ inputs.confirm_check == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      IDENTITY_EMAIL_DELIVERY_ENABLED: "true"
      IDENTITY_SMTP_HOST: ${{ secrets.MAALENEX_SMTP_HOST }}
      IDENTITY_SMTP_PORT: ${{ secrets.MAALENEX_SMTP_PORT || '587' }}
      IDENTITY_SMTP_USERNAME: ${{ secrets.MAALENEX_SMTP_USERNAME }}
      IDENTITY_SMTP_PASSWORD: ${{ secrets.MAALENEX_SMTP_PASSWORD }}
      IDENTITY_SMTP_FROM_EMAIL: ${{ secrets.MAALENEX_SMTP_FROM_EMAIL }}
      IDENTITY_SMTP_STARTTLS: ${{ secrets.MAALENEX_SMTP_STARTTLS || 'true' }}
      IDENTITY_SMTP_USE_SSL: ${{ secrets.MAALENEX_SMTP_USE_SSL || 'false' }}
      IDENTITY_SMTP_TIMEOUT_SECONDS: "10"
    steps:
      - name: Checkout selected branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate protected SMTP configuration exists
        shell: bash
        run: |
          if [ -z "$IDENTITY_SMTP_HOST" ] || [ -z "$IDENTITY_SMTP_FROM_EMAIL" ]; then
            echo "::error::Configure MAALENEX_SMTP_HOST and MAALENEX_SMTP_FROM_EMAIL as repository or environment secrets before running this check."
            exit 1
          fi
          if [ -n "$IDENTITY_SMTP_USERNAME" ] && [ -z "$IDENTITY_SMTP_PASSWORD" ]; then
            echo "::error::SMTP username is set but the password secret is missing."
            exit 1
          fi
      - name: Install backend
        run: python -m pip install .
      - name: Check SMTP TCP, TLS and authentication without sending email
        run: python scripts/check_identity_smtp.py
