name: MaaleNex Gmail SMTP connectivity (manual, non-sending)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/identity-smtp-connectivity.yml

permissions:
  contents: read

concurrency:
  group: maalenex-gmail-smtp-connectivity
  cancel-in-progress: false

jobs:
  smtp-connectivity:
    name: Verify Gmail SMTP transport and authentication
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      IDENTITY_EMAIL_DELIVERY_ENABLED: "true"
      IDENTITY_SMTP_HOST: smtp.gmail.com
      IDENTITY_SMTP_PORT: "587"
      IDENTITY_SMTP_USERNAME: ${{ secrets.MAALENEX_SMTP_USERNAME }}
      IDENTITY_SMTP_PASSWORD: ${{ secrets.MAALENEX_SMTP_PASSWORD }}
      IDENTITY_SMTP_FROM_EMAIL: ${{ secrets.MAALENEX_SMTP_USERNAME }}
      IDENTITY_SMTP_STARTTLS: "true"
      IDENTITY_SMTP_USE_SSL: "false"
      IDENTITY_SMTP_TIMEOUT_SECONDS: "10"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout verified A3 identity implementation
        uses: actions/checkout@v4
        with:
          ref: bb900bdef8ac801f5e3f4679be17e6e546b3679e
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Validate protected Gmail SMTP credentials exist
        shell: bash
        run: |
          if [ -z "$IDENTITY_SMTP_USERNAME" ]; then
            echo "::error::Configure MAALENEX_SMTP_USERNAME as a repository or environment secret."
            exit 1
          fi
          if [ -z "$IDENTITY_SMTP_PASSWORD" ]; then
            echo "::error::Configure MAALENEX_SMTP_PASSWORD as a repository or environment secret."
            exit 1
          fi
      - name: Install backend
        run: python -m pip install .
      - name: Check Gmail SMTP TCP, STARTTLS and authentication without sending email
        run: python scripts/check_identity_smtp.py
