name: A3 Passenger MVP Verification

on:
  push:
    branches:
      - main
      - feat/a3-passenger-mvp
      - integration/passenger-g1-sync-candidate
      - feat/passenger-ux-resilience
      - feat/a3-passenger-only-integration
      - ci/main-branch-verification

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend, migrations and PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and verification dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app migrations tests scripts
      - name: Ruff
        run: python -m ruff check --select E4,E7,E9,F --ignore F401 app migrations tests scripts
      - name: Apply all migrations to isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify Alembic metadata parity
        run: python -m alembic check
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend:
    name: Frontend tests, typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated frontend lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Run npm dependency vulnerability audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          echo "npm audit exit code: $audit_status"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::npm audit reported vulnerabilities or an audit-service error; inspect the uploaded JSON report."
          fi
      - name: Upload npm dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-npm-audit-report
          path: frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  commit-frontend-lockfile:
    name: Commit generated frontend lockfile to A3 branch
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/a3-passenger-only-integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact A3 branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download generated lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: maalenex-frontend-package-lock
          path: /tmp/maalenex-lock
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/maalenex-lock/package-lock.json
          cp /tmp/maalenex-lock/package-lock.json frontend/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend lockfile already matches the generated dependency graph."
          else
            git commit -m "build: lock frontend dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
