name: MaaleNex synthetic verification email E2E (manual only)

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Owner-designated test mailbox (must match the fixed allowlist)
        required: true
        type: string
        default: akeayudaka@gmail.com

permissions:
  contents: read

concurrency:
  group: maalenex-synthetic-email-e2e
  cancel-in-progress: false

jobs:
  synthetic-email-e2e:
    name: Send one synthetic verification email and verify audit trail
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      SYNTHETIC_DATA_ONLY: "true"
      IDENTITY_EXPOSE_TEST_TOKENS: "false"
      IDENTITY_EMAIL_DELIVERY_ENABLED: "true"
      IDENTITY_SMTP_HOST: smtp.gmail.com
      IDENTITY_SMTP_PORT: "587"
      IDENTITY_SMTP_USERNAME: ${{ secrets.MAALENEX_SMTP_USERNAME }}
      IDENTITY_SMTP_PASSWORD: ${{ secrets.MAALENEX_SMTP_PASSWORD }}
      IDENTITY_SMTP_FROM_EMAIL: ${{ secrets.MAALENEX_SMTP_USERNAME }}
      IDENTITY_SMTP_FROM_NAME: MaaleNex Test
      IDENTITY_SMTP_STARTTLS: "true"
      IDENTITY_SMTP_USE_SSL: "false"
      IDENTITY_SMTP_TIMEOUT_SECONDS: "15"
      E2E_RECIPIENT: ${{ inputs.recipient }}
      E2E_ALLOWED_RECIPIENT: akeayudaka@gmail.com
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout isolated test implementation
        uses: actions/checkout@v4
        with:
          ref: feat/a3-synthetic-email-e2e-test
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Generate ephemeral identity encryption keys
        shell: bash
        run: |
          set +x
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("IDENTITY_ENCRYPTION_KEY=" + secrets.token_urlsafe(48))
          print("IDENTITY_LOOKUP_KEY=" + secrets.token_urlsafe(48))
          PY
      - name: Validate protected Gmail secrets without revealing values
        shell: bash
        run: |
          set +x
          if [ -z "$IDENTITY_SMTP_USERNAME" ] || [ -z "$IDENTITY_SMTP_PASSWORD" ]; then
            echo "::error::Required Gmail SMTP secrets are missing."
            exit 1
          fi
          normalized="${IDENTITY_SMTP_PASSWORD//[[:space:]]/}"
          if [ "${#normalized}" -ne 16 ]; then
            echo "::error::Gmail App Password must be 16 characters after whitespace normalization."
            exit 1
          fi
          if [ "$E2E_RECIPIENT" != "$E2E_ALLOWED_RECIPIENT" ]; then
            echo "::error::Recipient is not on the fixed Owner-approved allowlist."
            exit 1
          fi
          echo "PASS: protected SMTP secret presence, App Password shape and fixed recipient allowlist."
      - name: Install backend and test dependencies
        run: python -m pip install '.[dev]'
      - name: Apply migrations to isolated ephemeral PostgreSQL
        run: alembic upgrade head
      - name: Execute one synthetic registration and verification email
        run: python scripts/run_identity_email_e2e.py
