name: G1 backend foundation verification
# Wallet slice verification: run lint, tests and PostgreSQL migrations on the exact PR head.
# Push verification is enabled for the passenger foundation branch so both platform gates can be tied to one exact commit SHA.
# Passenger wallet: run exact-head lint, tests and PostgreSQL migration verification.
# Verification coverage includes My Bookings, ownership-safe cancellation, and scheduled hold expiry.
# P1 exact-head coverage includes fleet evidence review, seat-map geometry, dispatch exceptions, fare history and PostgreSQL ownership integration.
# Private evidence storage also runs a real presigned PUT/HEAD/ranged-GET smoke test against ephemeral local S3-compatible Silo service.

on:
  push:
    branches: [feat/passenger-identity-service, feat/passenger-booking-flow, feat/passenger-support-service, feat/passenger-reports-complaints, feat/passenger-wallet-service, feat/passenger-notifications-service, feat/my-bookings-hold-expiry-notifications, feat/scheduler-operations-rbac-dashboards, fix/passenger-password-minimum-six, feat/passenger-backend-connectivity-foundation, feat/iroka-integration-contract-v1, feat/cargo-consignment-backend-v1]
    paths:
      - "backend/**"
      - "docs/deployment/**"
      - ".github/workflows/g1-backend-verification.yml"
      - ".github/workflows/android-shell-verification.yml"
  pull_request:
    branches: [main, feat/a3-passenger-only-integration, feat/full-platform-clean, feat/acceptance-remediation, feat/passenger-identity-service, feat/passenger-journey-search, feat/passenger-booking-flow, feat/passenger-support-service, feat/passenger-reports-complaints, feat/passenger-wallet-service, feat/passenger-notifications-service, feat/my-bookings-hold-expiry-notifications, feat/scheduler-operations-rbac-dashboards, feat/passenger-backend-connectivity-foundation, feat/iroka-integration-contract-v1, feat/cargo-consignment-backend-v1]
    paths:
      - "backend/**"
      - ".github/workflows/g1-backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: Backend tests, lint and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_PROVIDER: r2
      OBJECT_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: maalenex-synthetic-smoke
      OBJECT_STORAGE_ACCESS_KEY_ID: minio-${{ github.run_id }}-ci
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minio-${{ github.run_id }}-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Build production API container
        run: docker build --tag maalenex-moto-api:ci --file Dockerfile .
      - name: Start local S3-compatible storage service
        run: |
          docker run -d --name maalenex-silo -p 9000:9000 \
            -e MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_ACCESS_KEY" \
            docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z \
            server /data --console-address ":9001"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "PASS: local S3-compatible storage is live"
              exit 0
            fi
            sleep 2
          done
          docker logs maalenex-silo
          exit 1
      - name: Ruff wallet ledger implementation
        run: >-
          python -m ruff check --output-format=github
          app/db/model_registry.py
          app/domains/wallet/models.py
          app/domains/wallet/service.py
          tests/test_wallet_ledger.py
          migrations/versions/0008_wallet_double_entry_ledger.py
          app/domains/identity/passenger_models.py
          app/domains/identity/passenger_service.py
          app/routers/passenger_auth.py
          app/routers/bookings.py
          tests/test_passenger_identity.py
          migrations/versions/0009_passenger_identity.py
          app/domains/support/passenger_models.py
          app/routers/passenger_support.py
          tests/test_passenger_support.py
          migrations/versions/0010_passenger_support_cases.py
          app/domains/support/report_models.py
          app/routers/passenger_reports.py
          app/routers/admin.py
          app/domains/fleet/models.py
          app/domains/fleet/object_storage.py
          tests/test_fleet_object_storage.py
          tests/test_fleet_object_storage_s3.py
          app/domains/trips/models.py
          migrations/versions/0016_fleet_compliance_and_geometry.py
          app/main.py
          tests/test_passenger_reports.py
          migrations/versions/0011_passenger_reports_complaints.py
          app/domains/wallet/passenger_service.py
          app/routers/passenger_wallet.py
          tests/test_passenger_wallet.py
          app/domains/bookings/models.py
          app/domains/bookings/service.py
          app/domains/notifications/**
          app/routers/passenger_notifications.py
          app/routers/passenger_bookings.py
          app/jobs/booking_hold_expiry.py
          tests/test_passenger_notifications.py
          migrations/versions/0013_passenger_notifications.py
          migrations/versions/0014_verified_booking_ownership.py
          migrations/versions/0012_passenger_wallet.py
          tests/test_verified_booking_ownership.py
          app/domains/operations/**
          app/jobs/scheduler_service.py
          app/jobs/scheduler_worker.py
          app/routers/staff_admin.py
          app/routers/auth.py
          app/core/config.py
          tests/test_scheduler_operations.py
          tests/test_operations_cross_module_integration.py
          tests/test_health.py
          app/routers/health.py
          app/jobs/scheduler_worker.py
          migrations/versions/0015_scheduler_operations_rbac.py
          scripts/seed_synthetic_admin.py
          app/domains/cargo/**
          app/routers/cargo.py
          tests/test_cargo_lifecycle.py
          migrations/versions/0019_cargo_consignments.py
      - name: Backend tests
        run: python -m pytest -q
      - name: Apply baseline migration to empty database
        run: python -m alembic upgrade head
      - name: Exercise HTTPS passenger API session and CORS flow
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmp/api.key" -out "$tmp/api.crt" -days 1 -subj "/CN=localhost" >/dev/null 2>&1
          SECURE_COOKIES=true python -m uvicorn app.main:app --host 127.0.0.1 --port 8443 --ssl-keyfile "$tmp/api.key" --ssl-certfile "$tmp/api.crt" > "$tmp/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; cat "$tmp/api.log"' EXIT
          api="https://127.0.0.1:8443"
          origin="https://appassets.androidplatform.net"
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent "$api/api/v1/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --insecure --fail --silent "$api/api/v1/ready" >/dev/null
          curl --insecure --silent --show-error -D "$tmp/cors.headers" -o /dev/null -X OPTIONS "$api/api/v1/passenger/auth/register" \
            -H "Origin: $origin" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,x-csrf-token"
          grep -iq "^access-control-allow-origin: $origin" "$tmp/cors.headers"
          grep -iq "^access-control-allow-credentials: true" "$tmp/cors.headers"
          grep -iq "x-csrf-token" "$tmp/cors.headers"
          curl --insecure --fail --silent --show-error -D "$tmp/register.headers" \
            -c "$tmp/cookies.txt" -H "Origin: $origin" -H "Content-Type: application/json" \
            -d '{"login_identifier":"api-smoke@example.test","display_name":"API Smoke Passenger","password":"pass1234"}' \
            "$api/api/v1/passenger/auth/register" > "$tmp/register.json"
          grep -iq "mnm_passenger_session=.*HttpOnly.*SameSite=none.*Secure" "$tmp/register.headers"
          grep -iq "mnm_passenger_csrf=.*SameSite=none.*Secure" "$tmp/register.headers"
          csrf="$(awk '$6 == "mnm_passenger_csrf" { print $7 }' "$tmp/cookies.txt")"
          test -n "$csrf"
          curl --insecure --fail --silent --show-error -b "$tmp/cookies.txt" -c "$tmp/cookies.txt" \
            -H "Origin: $origin" -H "Content-Type: application/json" -H "X-CSRF-Token: $csrf" \
            -X PATCH -d '{"display_name":"API Smoke Passenger Updated"}' \
            "$api/api/v1/passenger/auth/profile" > "$tmp/profile.json"
          python -c "import json; assert json.load(open('$tmp/profile.json'))['display_name'] == 'API Smoke Passenger Updated'"
          curl --insecure --fail --silent --show-error -b "$tmp/cookies.txt" \
            -H "Origin: $origin" "$api/api/v1/passenger/auth/sessions/current" > "$tmp/session.json"
          python -c "import json; assert json.load(open('$tmp/session.json'))['login_identifier'] == 'api-smoke@example.test'"
          echo "PASS: HTTPS readiness, exact-origin credentialed CORS, Secure/SameSite=None cookies, registration, CSRF-protected profile update and authenticated session retrieval"
      - name: Check Alembic metadata parity
        run: python -m alembic check
      - name: Test full migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head
      - name: Stop local S3-compatible storage service
        if: always()
        run: docker rm -f maalenex-silo || true
