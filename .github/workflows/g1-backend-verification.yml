name: G1 backend foundation verification

on:
  push:
    branches: [feat/a3-canonical-postgis-integration]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/martin/**"
      - ".github/workflows/g1-backend-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/martin/**"
      - ".github/workflows/g1-backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: Backend tests, lint and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check app tests migrations
      - name: Backend tests
        run: python -m pytest -q
      - name: Apply schema through canonical PostGIS baseline
        run: python -m alembic upgrade 0020_canonical_postgis_schema
      - name: Seed synthetic legacy MITP backfill fixtures
        run: python scripts/seed_mitp_backfill_fixture.py
      - name: Apply MITP canonical backfill migration
        run: python -m alembic upgrade head
      - name: Verify tenant-safe MITP backfill and quarantine
        env:
          RUN_MITP_BACKFILL_INTEGRATION: "1"
        run: python -m pytest -q tests/test_mitp_geo_backfill.py
      - name: Verify canonical PostGIS schema and tenant-bound tracking keys
        env:
          RUN_GEO_SCHEMA_INTEGRATION: "1"
        run: python -m pytest -q tests/test_geo_schema.py
      - name: Verify A3.4 public and internal view privileges
        env:
          RUN_GEO_PUBLIC_VIEWS_INTEGRATION: "1"
        run: python -m pytest -q tests/test_geo_public_views.py
      - name: Verify A3.5 tenant RLS and cross-tenant isolation
        env:
          RUN_GEO_RLS_INTEGRATION: "1"
        run: python -m pytest -q tests/test_geo_tenant_rls.py
      - name: Provision disposable least-privilege Martin reader
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/maalenex_dev" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE maalenex_martin_login LOGIN PASSWORD 'ci-only-secret';
          GRANT CONNECT ON DATABASE maalenex_dev TO maalenex_martin_login;
          GRANT maalenex_geo_public_reader TO maalenex_martin_login;
          SQL
      - name: Start Martin with the dedicated public-reader login
        run: |
          docker run -d --name maalenex-martin-smoke --network host \
            -e MAALENEX_GEO_PUBLIC_DATABASE_URL='postgresql://maalenex_martin_login:ci-only-secret@127.0.0.1:5432/maalenex_dev' \
            -v "$GITHUB_WORKSPACE/infra/martin/config.yaml:/etc/martin/config.yaml:ro" \
            ghcr.io/maplibre/martin:v0.19.3 --config /etc/martin/config.yaml
      - name: Verify Martin catalog and public TileJSON sources
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/martin/catalog -o /tmp/martin-catalog.json; then break; fi
            sleep 2
          done
          test -s /tmp/martin-catalog.json
          for source in locations terminals routes route_stops boundaries roads; do
            curl --fail --silent "http://127.0.0.1:3000/martin/$source" -o "/tmp/martin-$source.json"
            test -s "/tmp/martin-$source.json"
          done
          ! grep -q "vehicle_positions\|device_identifier\|credential_ciphertext" /tmp/martin-catalog.json
      - name: Verify Martin login cannot read internal tracking tables
        run: |
          if PGPASSWORD=ci-only-secret psql -h 127.0.0.1 -U maalenex_martin_login -d maalenex_dev -v ON_ERROR_STOP=1 -c "SELECT 1 FROM geo.vehicle_positions LIMIT 1"; then
            echo "Martin public reader unexpectedly accessed internal vehicle positions"
            exit 1
          fi
          if PGPASSWORD=ci-only-secret psql -h 127.0.0.1 -U maalenex_martin_login -d maalenex_dev -v ON_ERROR_STOP=1 -c "SELECT 1 FROM geo.devices LIMIT 1"; then
            echo "Martin public reader unexpectedly accessed device records"
            exit 1
          fi
      - name: Stop disposable Martin service
        if: always()
        run: docker rm -f maalenex-martin-smoke || true
      - name: Check Alembic metadata parity
        run: python -m alembic check
      - name: Downgrade A3.3 and verify legacy source preservation
        run: python -m alembic downgrade 0020_canonical_postgis_schema
      - name: Assert A3.3 rollback retained legacy MITP records
        env:
          RUN_MITP_BACKFILL_DOWNGRADE: "1"
        run: python -m pytest -q tests/test_mitp_geo_downgrade.py
      - name: Test full migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend-build:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite production build
        working-directory: frontend
        run: npm run build
