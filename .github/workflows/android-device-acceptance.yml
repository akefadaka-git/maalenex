name: Android device acceptance build

on:
  push:
    branches:
      - fix/android-device-acceptance-emulator
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a long emulator boot just because a second push/dispatch arrives.
# Queue the newer run instead; every tested SHA must retain its own evidence.
concurrency:
  group: android-device-acceptance-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  backend-postgres:
    name: Backend and PostgreSQL regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and verification dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app migrations tests scripts
      - name: Ruff
        run: python -m ruff check --select E4,E7,E9,F --ignore F401 app migrations tests scripts
      - name: Apply migrations and verify metadata parity
        run: python -m alembic upgrade head && python -m alembic check
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.MAALENEX_TEST_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Report API-origin configuration
        shell: bash
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::MAALENEX_TEST_API_BASE_URL is not configured. This APK is a shell smoke-test build; server-backed journeys cannot pass."
          else
            node --input-type=module -e '
              const value = process.env.VITE_API_BASE_URL;
              const url = new URL(value);
              if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash ||
                  /YOUR-TEST-API-HOST|example\.(com|org|net)|\.invalid$|\.example$|\.test$/i.test(url.hostname)) {
                throw new Error("MAALENEX_TEST_API_BASE_URL must be a real HTTPS origin without path, credentials, query, fragment or placeholders.");
              }
              console.log("Configured HTTPS API origin:", url.origin);
            '
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install Android emulator and stable AOSP image
        run: sdkmanager "emulator" "system-images;android-30;default;x86_64"
      - name: Install Capacitor Android toolchain
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Generate APK checksum and dependency lock evidence
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee maalenex-apk.sha256
          test -s package-lock.json
      - name: Upload debug APK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-android-debug
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/maalenex-apk.sha256
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Boot isolated Android emulator and run acceptance
        shell: bash
        working-directory: .
        run: |
          set -Eeuo pipefail
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          export ANDROID_SERIAL="emulator-5554"
          mkdir -p "$ANDROID_AVD_HOME"

          printf 'no\n' | avdmanager create avd --force --name maalenex-ci --package "system-images;android-30;default;x86_64" --device "pixel_2"
          test -s "$ANDROID_AVD_HOME/maalenex-ci.ini" || {
            echo "AVD manager did not create the expected AVD at $ANDROID_AVD_HOME." >&2
            find "$ANDROID_USER_HOME" -maxdepth 4 -type f -name 'maalenex-ci.ini' -print || true
            exit 1
          }

          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd maalenex-ci -port 5554 \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -wipe-data -no-metrics -camera-back none -camera-front none \
            -memory 4096 -cores 4 > /tmp/maalenex-emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > /tmp/maalenex-emulator.pid

          if ! timeout 180s adb -s "$ANDROID_SERIAL" wait-for-device; then
            echo "Emulator did not register with ADB within 3 minutes." >&2
            cat /tmp/maalenex-emulator.log || true
            adb devices -l || true
            exit 1
          fi

          booted=""
          for attempt in $(seq 1 180); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator process exited before boot completed." >&2
              cat /tmp/maalenex-emulator.log || true
              exit 1
            fi
            booted="$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$booted" == "1" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            adb -s "$ANDROID_SERIAL" logcat -d -t 3000 > frontend/maalenex-emulator-logcat.txt || true
            echo "Android emulator failed to complete boot within 15 minutes." >&2
            adb devices -l || true
            cat /tmp/maalenex-emulator.log || true
            exit 1
          fi

          bash frontend/scripts/android-emulator-acceptance.sh
      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-android-emulator-evidence
          path: |
            frontend/maalenex-window.xml
            frontend/maalenex-emulator.png
            frontend/maalenex-apk.sha256
            frontend/maalenex-emulator-logcat.txt
            /tmp/maalenex-emulator.log
          if-no-files-found: warn
          retention-days: 30
