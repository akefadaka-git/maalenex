name: Android device acceptance build

on:
  push:
    branches:
      - fix/android-device-acceptance-emulator
  pull_request:
    branches:
      - main
      - feat/android-debug-apk
      - fix/android-device-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.MAALENEX_TEST_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Report API-origin configuration
        shell: bash
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::MAALENEX_TEST_API_BASE_URL is not configured. This APK is a shell smoke-test build; server-backed journeys cannot pass."
          else
            node --input-type=module -e '
              const value = process.env.VITE_API_BASE_URL;
              const url = new URL(value);
              if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash ||
                  /YOUR-TEST-API-HOST|example\.(com|org|net)|\.invalid$|\.example$|\.test$/i.test(url.hostname)) {
                throw new Error("MAALENEX_TEST_API_BASE_URL must be a real HTTPS origin without path, credentials, query, fragment or placeholders.");
              }
              console.log("Configured HTTPS API origin:", url.origin);
            '
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install Capacitor Android toolchain
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            cd frontend
            adb wait-for-device
            booted=""
            for attempt in $(seq 1 60); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$booted" = "1" ]; then break; fi
              sleep 5
            done
            if [ "$booted" != "1" ]; then
              adb logcat -d -t 2000 > /tmp/maalenex-emulator-boot.log || true
              cat /tmp/maalenex-emulator-boot.log
              echo "Android emulator did not become ready within 5 minutes." >&2
              exit 1
            fi
            adb shell pm grant com.maalenex.moto android.permission.INTERNET 2>/dev/null || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.maalenex.moto 1
            sleep 12
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.maalenex.moto'
            adb shell uiautomator dump /sdcard/maalenex-window.xml >/dev/null
            adb pull /sdcard/maalenex-window.xml ./maalenex-window.xml
            adb exec-out screencap -p > maalenex-emulator.png
            if adb logcat -d -t 3000 -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -t 3000 -s AndroidRuntime:E
              exit 1
            fi
      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-android-emulator-evidence
          path: |
            frontend/maalenex-window.xml
            frontend/maalenex-emulator.png
          if-no-files-found: warn
          retention-days: 30
