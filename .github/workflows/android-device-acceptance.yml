name: Android device acceptance build

on:
  pull_request:
    branches:
      - main
      - feat/android-debug-apk
      - fix/android-device-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-acceptance-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: Backend and PostgreSQL regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and verification dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app migrations tests scripts
      - name: Ruff
        run: python -m ruff check --select E4,E7,E9,F --ignore F401 app migrations tests scripts
      - name: Apply migrations and verify metadata parity
        run: python -m alembic upgrade head && python -m alembic check
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.MAALENEX_TEST_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Report API-origin configuration
        shell: bash
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::MAALENEX_TEST_API_BASE_URL is not configured. This APK is a shell smoke-test build; server-backed journeys cannot pass."
          else
            node --input-type=module -e '
              const value = process.env.VITE_API_BASE_URL;
              const url = new URL(value);
              if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash ||
                  /YOUR-TEST-API-HOST|example\.(com|org|net)|\.invalid$|\.example$|\.test$/i.test(url.hostname)) {
                throw new Error("MAALENEX_TEST_API_BASE_URL must be a real HTTPS origin without path, credentials, query, fragment or placeholders.");
              }
              console.log("Configured HTTPS API origin:", url.origin);
            '
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install Capacitor Android toolchain
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Generate APK checksum and dependency lock evidence
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee maalenex-apk.sha256
          test -s package-lock.json
      - name: Upload debug APK and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-android-debug
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/maalenex-apk.sha256
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash frontend/scripts/android-emulator-acceptance.sh
      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-android-emulator-evidence
          path: |
            frontend/maalenex-window.xml
            frontend/maalenex-emulator.png
            frontend/maalenex-apk.sha256
          if-no-files-found: warn
          retention-days: 30
