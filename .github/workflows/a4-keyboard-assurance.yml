name: A4 Passenger Keyboard and Focus Assurance

on:
  push:
    branches:
      - a4/passenger-keyboard-assurance
  pull_request:
    branches:
      - a4/passenger-keyboard-assurance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-keyboard-assurance:
    name: Chromium keyboard focus and skip-navigation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact A4 commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-fund
      - name: Run existing frontend checks and production build
        run: npm test && npm run typecheck && npm run build
      - name: Install isolated browser-test dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/maalenex-vite-preview.log 2>&1 &
          echo $! > /tmp/maalenex-vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/maalenex-vite-preview.log
          exit 1
      - name: Verify keyboard traversal and focus behavior at desktop and mobile widths
        run: node scripts/a4-keyboard-focus.mjs
