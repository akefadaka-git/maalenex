name: MaaleNex A3 exact-HEAD dependency security audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/security-triggers/a3-exact-head-audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependencies:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-9
            ref: 7254d992de24d801be1e8a2e16d2114b1241e94c
          - label: PR-10
            ref: 0eac037e8df52e8422f8bddd89e0a45fd80ce61f
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and audit tool
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]' pip-audit
      - name: Audit installed Python dependencies
        working-directory: backend
        run: pip-audit --strict --skip-editable

  frontend-dependencies:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-9
            ref: 7254d992de24d801be1e8a2e16d2114b1241e94c
          - label: PR-10
            ref: 0eac037e8df52e8422f8bddd89e0a45fd80ce61f
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Resolve an ephemeral lockfile without repository mutation
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit complete frontend dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high
