name: MaaleNex A3 exact-HEAD dependency security audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/security-triggers/a3-exact-head-audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependencies:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-9
            ref: 046926f4b77687455cdd80e15f637c2e671ee272
          - label: PR-10
            ref: 456e15f3b95c53ee389c407b057abad5e572af13
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a requirements-only audit input
        working-directory: backend
        run: |
          python - <<'PY' > "$RUNNER_TEMP/requirements-audit.txt"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          for requirement in project["project"]["dependencies"]:
              print(requirement)
          for requirement in project["project"].get("optional-dependencies", {}).get("dev", []):
              print(requirement)
          PY
      - name: Audit Python dependencies and transitive requirements
        working-directory: backend
        run: pip-audit --strict -r "$RUNNER_TEMP/requirements-audit.txt"

  frontend-dependencies:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-9
            ref: 046926f4b77687455cdd80e15f637c2e671ee272
          - label: PR-10
            ref: 456e15f3b95c53ee389c407b057abad5e572af13
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve an ephemeral lockfile without repository mutation
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit complete frontend dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high
