name: MaaleNex Android shell verification

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-shell-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-emulator:
    name: Android assemble, lint and emulator launch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend for Android asset packaging
        working-directory: frontend
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK and run Android lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.maalenex.moto
            adb shell am start -W -n com.maalenex.moto/.MainActivity
            sleep 10
            adb shell pidof com.maalenex.moto
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/maalenex-window.xml
            grep -qi "MAALENEX" /tmp/maalenex-window.xml
            if adb logcat -d -t 2000 | grep -q "FATAL EXCEPTION"; then
              echo "Fatal Android exception detected"
              exit 1
            fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
