name: MaaleNex Android shell verification

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-shell-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-emulator:
    name: Android assemble, lint and emulator launch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend for Android asset packaging
        working-directory: frontend
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK and run Android lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch on Android 15 emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            adb start-server
            adb wait-for-device
            device_ready=false
            for attempt in $(seq 1 90); do
              adb reconnect >/dev/null 2>&1 || true
              boot_state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [ "$boot_state" = "1" ]; then device_ready=true; break; fi
              sleep 2
            done
            test "$device_ready" = "true"
            unlock_ok=false
            for attempt in $(seq 1 10); do
              if adb shell input keyevent 82 >/dev/null 2>&1; then unlock_ok=true; break; fi
              adb reconnect >/dev/null 2>&1 || true
              sleep 2
            done
            test "$unlock_ok" = "true"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.maalenex.moto
            adb shell am start -W -n com.maalenex.moto/.MainActivity
            for attempt in $(seq 1 30); do adb shell pidof com.maalenex.moto >/dev/null 2>&1 && break; sleep 2; done
            adb shell pidof com.maalenex.moto
            adb logcat -d -t 4000 > /tmp/maalenex-logcat.txt
            if grep -q "FATAL EXCEPTION" /tmp/maalenex-logcat.txt; then cat /tmp/maalenex-logcat.txt; echo "Fatal Android exception detected"; exit 1; fi
            adb shell dumpsys activity activities | grep -q "com.maalenex.moto/.MainActivity"
